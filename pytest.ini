[pytest]
# Pytest configuration for AI Research Agent

# Test paths
testpaths = tests

# Markers
markers =
    integration: Integration tests requiring API keys
    unit: Unit tests with mocked dependencies
    slow: Slow-running tests
    a2a: Agent-to-Agent communication tests

# Output options
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# Environment
env =
    ANTHROPIC_API_KEY=
    RAG_CACHE_DIR=./test_cache
    RAG_VECTOR_DB_DIR=./test_chroma_db

# Coverage (optional)
# addopts = --cov=agent --cov-report=html

# Asyncio
asyncio_mode = auto
